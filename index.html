<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>謙懿拍貼趣</title>
<!-- 字型有網路才載入；斷網時自動改用裝置內建的圓體／黑體，版面不會跑掉 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
  /* Tuesday 配色（DESIGN.md 02-B） */
  :root {
    --text: #08040c;
    --bg: #f8f4fc;
    --text-2: #4b352a;
    --sage: #b2cd9c;
    --accent: #ff7d2a;
    --accent-hover: #f26c16;
    --accent-active: #dc5c0a;
    --on-accent: #08040c;
    --card: #ffffff;
    --line: #e6dcef;
    --error: #B42318;
    --error-bg: #FFF1F0;
    --error-border: #F4B4AD;
    --warning-text: #7a4f06;
    --warning-bg: #fdf3da;
    --success-text: #2f5c19;
    --success-bg: #eef6e4;
    --focus: #4B63C3;
    --radius-md: 12px;
    --radius-lg: 16px;
    --shadow: 0 2px 8px rgba(34, 7, 14, 0.06);
    --font: "Huninn", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font-family: inherit; }
  [hidden] { display: none !important; }

  /* ---------- 頂部 ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 24px;
    background: var(--text);
    color: var(--bg);
  }
  .logo {
    background: none;
    border: 0;
    color: inherit;
    font-size: clamp(20px, 2.4vw, 28px);
    font-weight: 900;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
    cursor: default;
  }
  .logo-dot {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--accent);
    display: grid; place-items: center;
  }
  .logo-dot svg { width: 20px; height: 20px; }
  .steps { display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; }
  .steps li {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px 6px 6px;
    border-radius: 999px;
    font-weight: 700;
    font-size: clamp(14px, 1.5vw, 18px);
    color: #b9aec4;
  }
  .steps li b {
    width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    background: #2a2232; color: #b9aec4;
  }
  .steps li.on { background: var(--accent); color: var(--on-accent); }
  .steps li.on b { background: var(--text); color: var(--bg); }
  .steps li.done { color: var(--sage); }

  /* ---------- 主畫面 ---------- */
  main { flex: 1; min-height: 0; position: relative; }
  .screen {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) clamp(300px, 30vw, 420px);
    gap: 24px;
    padding: 24px;
  }
  .stage { min-width: 0; min-height: 0; display: grid; place-items: center; position: relative; }
  .side {
    min-height: 0;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 16px;
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 24px;
  }
  .side .grow { flex: 1; }
  .side-split { padding: 0; gap: 0; overflow: hidden; }
  .side-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 12px; }
  .side-actions { display: flex; gap: 10px; padding: 12px 20px 20px; border-top: 1px solid var(--line); }
  .side-actions .btn-xl { flex: 1; min-height: 64px; }
  .side-actions .btn-secondary { flex: none; }
  h2 { margin: 0; font-size: clamp(24px, 2.6vw, 32px); font-weight: 900; }
  h3 { margin: 4px 0 0; font-size: 18px; font-weight: 700; color: var(--text-2); }
  .big-msg { margin: 0; font-size: clamp(22px, 2.4vw, 30px); font-weight: 900; line-height: 1.4; }
  .small { margin: 0; font-size: 15px; color: var(--text-2); line-height: 1.6; }

  footer {
    text-align: center;
    padding: 8px 16px 12px;
    font-size: 14px;
    color: var(--text-2);
  }

  /* ---------- 按鈕 ---------- */
  .btn {
    border-radius: var(--radius-md);
    padding: 12px 24px;
    font-weight: 700;
    font-size: 20px;
    min-height: 56px;
    border: 2px solid transparent;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .08s, background .15s;
  }
  .btn svg { width: 24px; height: 24px; flex: none; }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible, .chip:focus-visible, .tile:focus-visible, .logo:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { background: var(--accent-active); }
  .btn-primary:disabled { background: #f3d6c3; color: #8a7d74; cursor: not-allowed; }
  .btn-secondary { background: var(--card); color: var(--text); border-color: var(--line); }
  .btn-secondary:hover { border-color: var(--text-2); }
  .btn-xl { font-size: clamp(24px, 2.6vw, 32px); min-height: 80px; padding: 16px 40px; border-radius: var(--radius-lg); }
  .btn-block { width: 100%; }

  /* ---------- 首頁 ---------- */
  #home { grid-template-columns: 1fr; place-items: center; }
  .home-card { text-align: center; position: relative; padding: 48px 24px; }
  .home-card h1 {
    margin: 0;
    font-size: clamp(56px, 9vw, 128px);
    font-weight: 900;
    letter-spacing: 0.04em;
    line-height: 1.1;
  }
  .home-card h1 span { color: var(--accent); }
  .home-card .sub {
    margin: 16px 0 40px;
    font-size: clamp(24px, 3.4vw, 44px);
    font-weight: 700;
    color: var(--text-2);
  }
  .float {
    position: absolute;
    width: clamp(60px, 9vw, 120px);
    animation: bob 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes bob { 50% { transform: translateY(-12px) rotate(var(--r, 0deg)); } }
  @media (prefers-reduced-motion: reduce) { .float { animation: none; } }

  /* ---------- 選模式 ---------- */
  #mode { grid-template-columns: 1fr; place-items: center; overflow-y: auto; }
  .mode-wrap { text-align: center; width: min(100%, 960px); }
  .mode-wrap h2 { font-size: clamp(32px, 4.4vw, 52px); }
  .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 28px; }
  .mode-card {
    background: var(--card); color: var(--text);
    border: 3px solid var(--line); border-radius: var(--radius-lg);
    padding: 24px 12px; min-height: 280px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px;
    transition: transform .08s, border-color .15s;
  }
  .mode-card:hover { border-color: var(--accent); }
  .mode-card:active { transform: scale(0.97); }
  .mode-card:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .mode-card b { font-size: clamp(26px, 3vw, 36px); }
  .mode-card small { font-size: 17px; color: var(--text-2); }
  .pic { background: var(--accent); border-radius: 6px; padding: 6px 6px 16px; display: flex; flex-direction: column; gap: 4px; margin-bottom: auto; }
  .pic i { display: block; background: var(--bg); border-radius: 2px; }
  .pic.p1 i { width: 136px; height: 102px; }
  .pic.p2 i { width: 84px; height: 63px; }
  .pic.p4 i { width: 48px; height: 36px; }
  @media (max-width: 560px) {
    .mode-grid { grid-template-columns: 1fr; gap: 10px; }
    .mode-card { min-height: 0; flex-direction: row; justify-content: flex-start; padding: 12px 16px; gap: 16px; text-align: left; }
    .pic { display: none; }
  }

  /* ---------- 拍照 ---------- */
  .viewfinder {
    position: absolute;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #1c1622;
    box-shadow: var(--shadow);
  }
  .viewfinder video, .viewfinder canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  }
  .viewfinder video { transform: scaleX(-1); }
  .guide {
    position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
    background: rgba(8, 4, 12, .72); color: #fff;
    padding: 10px 20px; border-radius: 999px;
    font-size: clamp(18px, 2vw, 24px); font-weight: 700; white-space: nowrap;
  }
  .shot-progress {
    position: absolute; right: 16px; top: 16px;
    background: var(--accent); color: var(--on-accent);
    padding: 8px 18px; border-radius: 999px;
    font-size: clamp(18px, 2vw, 24px); font-weight: 700;
  }
  .countdown {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: clamp(120px, 22vw, 260px); font-weight: 900; color: #fff;
    -webkit-text-stroke: 8px #08040c; paint-order: stroke fill;
    text-shadow: 0 4px 24px rgba(0,0,0,.45);
    pointer-events: none;
  }
  .countdown.word { font-size: clamp(56px, 9vw, 110px); }
  .countdown.pop { animation: pop .9s ease-out; }
  @keyframes pop { from { transform: scale(1.6); opacity: 0; } 20% { opacity: 1; } to { transform: scale(1); } }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash .5s ease-out; }
  @keyframes flash { from { opacity: 1; } to { opacity: 0; } }
  .cam-msg {
    position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
    color: #fff; font-size: clamp(20px, 2.2vw, 28px); font-weight: 700; padding: 24px; line-height: 1.6;
  }

  /* ---------- 裝飾 ---------- */
  #editCanvas, #finalImg {
    position: absolute; inset: 0; margin: auto;
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(8, 4, 12, .12);
    touch-action: none;
    -webkit-touch-callout: none;
  }
  .hint {
    position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg);
    padding: 8px 18px; border-radius: 999px; font-size: 16px; font-weight: 700;
    white-space: nowrap; pointer-events: none;
    transition: opacity .3s;
  }
  .grid-frames { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .grid-stickers { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .tile {
    border: 2px solid var(--line); background: var(--card);
    border-radius: var(--radius-md);
    padding: 6px 2px; min-height: 60px;
    cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font-size: 14px; font-weight: 700; color: var(--text);
  }
  .tile:active { transform: scale(0.95); }
  .tile img { width: 40px; height: 40px; object-fit: contain; }
  .tile .swatch { width: 40px; height: 40px; border-radius: 10px; border: 2px solid rgba(8,4,12,.15); }
  .tile span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .tile.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent) inset; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    border: 2px solid var(--line); background: var(--bg);
    border-radius: 999px; padding: 6px 13px; min-height: 44px;
    font-size: 17px; font-weight: 700; color: var(--text); cursor: pointer;
  }
  .chip:active { transform: scale(0.95); background: var(--accent); }

  /* ---------- 帶走 ---------- */
  .qr-box {
    background: #fff; border-radius: var(--radius-lg); padding: 12px;
    border: 3px solid var(--text); align-self: center;
    width: min(100%, 300px);
  }
  #qrCanvas { width: 100%; height: auto; display: block; image-rendering: pixelated; }
  .spinner {
    width: 64px; height: 64px; border-radius: 50%;
    border: 7px solid var(--line); border-top-color: var(--accent);
    animation: spin 1s linear infinite; align-self: center;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .notice {
    border-radius: var(--radius-md); padding: 16px;
    background: var(--warning-bg); color: var(--warning-text);
    display: flex; gap: 12px; align-items: flex-start;
  }
  .notice svg { width: 32px; height: 32px; flex: none; }
  .notice p { margin: 0; font-size: clamp(20px, 2.2vw, 26px); font-weight: 900; line-height: 1.4; color: var(--text); }
  #done.offline { grid-template-columns: minmax(0, 1fr) clamp(260px, 24vw, 340px); }

  /* ---------- 遮罩視窗 ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8, 4, 12, .55);
    display: grid; place-items: center; padding: 16px;
  }
  .dialog {
    background: var(--card); border-radius: var(--radius-lg);
    padding: 32px; width: min(100%, 520px);
    display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 12px 40px rgba(8,4,12,.25);
    -webkit-user-select: text; user-select: text;
  }
  .dialog.center { text-align: center; }
  .idle-num { font-size: 72px; font-weight: 900; color: var(--accent); line-height: 1; }
  .field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
  .field input {
    font-size: 18px; padding: 12px 14px; border-radius: var(--radius-md);
    border: 2px solid var(--line); background: var(--bg); color: var(--text);
  }
  .field input:focus { outline: 3px solid var(--focus); outline-offset: 1px; }
  .field small { font-weight: 400; color: var(--text-2); font-size: 14px; line-height: 1.5; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row .btn { flex: 1; font-size: 17px; min-height: 48px; padding: 10px 16px; }
  .status { margin: 0; font-size: 15px; font-weight: 700; min-height: 1.5em; }
  .status.ok { color: var(--success-text); }
  .status.bad { color: var(--error); }

  /* ---------- 直式螢幕、手機 ---------- */
  @media (max-aspect-ratio: 1/1), (max-width: 760px) {
    header { padding: 10px 16px; }
    .steps li { padding: 4px; }
    .steps li span { display: none; }
    .screen { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 16px; padding: 16px; }
    #done.offline { grid-template-columns: 1fr; }
    .side { max-height: 46dvh; padding: 16px; }
    .grid-stickers { grid-template-columns: repeat(7, 1fr); }
    .tile img { width: 40px; height: 40px; }
  }
</style>
</head>
<body>

<header>
  <button class="logo" id="logo" type="button" aria-label="謙懿拍貼趣">
    <span class="logo-dot"><svg viewBox="0 0 24 24" fill="none" stroke="#08040c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></span>
    謙懿拍貼趣
  </button>
  <ol class="steps" id="steps" hidden>
    <li data-step="camera"><b>1</b><span>拍照</span></li>
    <li data-step="decorate"><b>2</b><span>裝飾</span></li>
    <li data-step="done"><b>3</b><span>帶走</span></li>
  </ol>
</header>

<main>
  <!-- 首頁（待機） -->
  <section class="screen" id="home">
    <div class="home-card">
      <img class="float" data-sticker="crown" style="left:-4%;top:-6%;--r:-8deg" alt="">
      <img class="float" data-sticker="balloon" style="right:-6%;top:-4%;animation-delay:.6s;--r:6deg" alt="">
      <img class="float" data-sticker="heart" style="left:2%;bottom:6%;animation-delay:1.2s" alt="">
      <img class="float" data-sticker="hundred" style="right:0;bottom:4%;animation-delay:.3s;--r:-6deg" alt="">
      <h1>謙懿<span>拍貼趣</span></h1>
      <p class="sub">不管幾歲，拍照萬歲！</p>
      <button class="btn btn-primary btn-xl" id="startBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        開始拍照
      </button>
    </div>
  </section>

  <!-- 選模式 -->
  <section class="screen" id="mode" hidden>
    <div class="mode-wrap">
      <h2>要拍幾張？</h2>
      <div class="mode-grid">
        <button class="mode-card" type="button" data-mode="1">
          <span class="pic p1"><i></i></span><b>1 張</b><small>最快</small>
        </button>
        <button class="mode-card" type="button" data-mode="2">
          <span class="pic p2"><i></i><i></i></span><b>2 連拍</b><small>換個姿勢</small>
        </button>
        <button class="mode-card" type="button" data-mode="4">
          <span class="pic p4"><i></i><i></i><i></i><i></i></span><b>4 連拍</b><small>最有拍貼感</small>
        </button>
      </div>
    </div>
  </section>

  <!-- 1 拍照 -->
  <section class="screen" id="camera" hidden>
    <div class="stage" id="camStage">
      <div class="viewfinder" id="viewfinder">
        <video id="video" playsinline muted autoplay></video>
        <canvas id="shotPreview" width="1520" height="1140" hidden></canvas>
        <div class="cam-msg" id="camMsg" hidden></div>
        <div class="guide" id="guide">擠近一點，大家都要入鏡喔！</div>
        <div class="shot-progress" id="shotProgress" hidden></div>
        <div class="countdown" id="countdown"></div>
        <div class="flash" id="flash"></div>
      </div>
    </div>
    <div class="side">
      <div id="liveCtrls" style="display:flex;flex-direction:column;gap:16px">
        <h2 id="camTitle">一起拍一張</h2>
        <p class="small" id="camDesc">大家站好、看鏡頭，按下按鈕後會倒數 3 秒。</p>
        <div class="grow"></div>
        <button class="btn btn-primary btn-xl btn-block" id="shootBtn" type="button" disabled>3、2、1 拍照</button>
        <label class="btn btn-secondary btn-block" id="pickBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
          選一張照片
          <input type="file" accept="image/*" id="fileInput" multiple hidden>
        </label>
        <button class="btn btn-secondary btn-block" id="changeModeBtn" type="button">換拍法</button>
      </div>
      <div id="reviewCtrls" hidden style="display:flex;flex-direction:column;gap:16px">
        <h2>拍得好棒！</h2>
        <p class="small">大家都有入鏡嗎？沒問題就來裝飾吧。</p>
        <div class="grow"></div>
        <button class="btn btn-primary btn-xl btn-block" id="useBtn" type="button">就用這張</button>
        <button class="btn btn-secondary btn-block" id="retakeBtn" type="button">再拍一次</button>
      </div>
    </div>
  </section>

  <!-- 2 裝飾 -->
  <section class="screen" id="decorate" hidden>
    <div class="stage">
      <canvas id="editCanvas" width="1600" height="1360"></canvas>
      <div class="hint" id="hint">用手指拖拖看，可以放大、轉一轉</div>
    </div>
    <div class="side side-split">
      <div class="side-scroll">
        <h2>把照片變可愛</h2>
        <h3>選一個框</h3>
        <div class="grid-frames" id="frameList"></div>
        <h3>加幾個貼紙</h3>
        <div class="grid-stickers" id="stickerList"></div>
        <h3>說一句話</h3>
        <div class="chips" id="phraseList"></div>
      </div>
      <div class="side-actions">
        <button class="btn btn-secondary" id="reshootBtn" type="button">重拍</button>
        <button class="btn btn-primary btn-xl" id="finishBtn" type="button">完成了！</button>
      </div>
    </div>
  </section>

  <!-- 3 帶走 -->
  <section class="screen" id="done" hidden>
    <div class="stage">
      <img id="finalImg" alt="完成的拍貼照片">
    </div>
    <div class="side">
      <div id="upLoading" style="display:flex;flex-direction:column;gap:16px">
        <h2>照片準備中…</h2>
        <div class="spinner"></div>
      </div>
      <div id="upOk" hidden style="display:flex;flex-direction:column;gap:16px">
        <p class="big-msg">掃描 QR Code，把照片存進手機！</p>

  const STK = {};

    img.onload = () => { s.img = img; res(); };

    catch (e) { return false; }
  }

  function todayText() {

  }

  // 拍照倒數的嗶聲（第一次按按鈕後才啟動，瀏覽器規定）
  let audio = null;
  function beep(freq, dur = 0.12) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = freq; o.type = 'sine';
      g.gain.setValueAtTime(0.18, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) { /* 沒聲音也不影響 */ }
  }

  // ===== 狀態 =====
  let screen = 'home';
  let stream = null;
  let shots = [];            // 拍好的照片，每張 1520×1140
  let frameId = FRAMES[0].id;

  const ORDER = ['camera', 'decorate', 'done'];
  function show(id) {

    for (const s of document.querySelectorAll('.screen')) s.hidden = s.id !== id;
    $('steps').hidden = id === 'home';
    const idx = ORDER.indexOf(id === 'mode' ? 'camera' : id);
    for (const li of $('steps').children) {
      const i = ORDER.indexOf(li.dataset.step);
      li.classList.toggle('on', i === idx);
      li.classList.toggle('done', i < idx);
    }
    poke();
    if (id === 'camera') fitViewfinder();
  }

  // ===== 1 拍照 =====
  const video = $('video');
  function fitViewfinder() {
    const st = $('camStage').getBoundingClientRect();
    let w = st.width, h = w * 3 / 4;
    if (h > st.height) { h = st.height; w = h * 4 / 3; }
    const vf = $('viewfinder');
    vf.style.width = w + 'px'; vf.style.height = h + 'px';
  }
  addEventListener('resize', () => { if (screen === 'camera') fitViewfinder(); });

  let camFailed = false;
  async function startCamera() {
    camFailed = false;
    $('camMsg').hidden = true;
    $('guide').hidden = false;
    $('shootBtn').disabled = true;
    if (stream) { $('shootBtn').disabled = false; return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camFail();
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false,
      });
      if (screen !== 'camera') { stopCamera(); return; }
      video.srcObject = stream;
      await video.play().catch(() => {});
      $('shootBtn').disabled = false;
    } catch (e) { camFail(); }
  }
  function camFail() {
    camFailed = true;
    $('camMsg').textContent = '沒有找到相機，請按「選一張照片」';
    if (!$('liveCtrls').hidden) { $('camMsg').hidden = false; $('guide').hidden = true; }
  }
  function stopCamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    video.srcObject = null;
  }

  function setLive(live) {
    $('liveCtrls').hidden = !live;
    $('reviewCtrls').hidden = live;
    $('shotPreview').hidden = live;
    $('camMsg').hidden = !live || !camFailed;
    $('guide').hidden = !live || camFailed;
    $('shotProgress').hidden = true;
  }

  // 照片一律裁成 4:3，跟取景框看到的一樣
  function grabShot(src, sw, sh, mirror) {
    const c = document.createElement('canvas');
    c.width = PH_W; c.height = PH_H;
    const x = c.getContext('2d');
    const s = Math.max(PH_W / sw, PH_H / sh);
    const dw = sw * s, dh = sh * s;
    if (mirror) { x.translate(PH_W, 0); x.scale(-1, 1); }
    x.drawImage(src, (PH_W - dw) / 2, (PH_H - dh) / 2, dw, dh);
    return c;
  }

  // 拍完先看一眼：1 張放滿，2 張左右並排，4 張田字排
  function showReview() {
    const c = $('shotPreview').getContext('2d');
    c.fillStyle = '#1c1622';
    c.fillRect(0, 0, PH_W, PH_H);
    if (shots.length === 1) {
      c.drawImage(shots[0], 0, 0);
    } else {
      const w = PH_W / 2, h = PH_H / 2, top = shots.length === 2 ? h / 2 : 0;
      shots.forEach((s, i) => {
        c.drawImage(s, (i % 2) * w + 5, top + Math.floor(i / 2) * h + 5, w - 10, h - 10);
      });
    }
    setLive(false);
  }

  let shooting = false;
  const stillHere = () => screen === 'camera' && stream;
  async function shoot() {
    if (shooting || !stream) return;
    shooting = true;
    shots = [];
    $('shootBtn').disabled = true;
    $('changeModeBtn').disabled = true;
    $('guide').hidden = true;
    const cd = $('countdown'), pr = $('shotProgress');
    for (let i = 0; i < L.shots; i++) {
      pr.hidden = L.shots === 1;
      pr.textContent = `第 ${i + 1} / ${L.shots} 張`;
      for (const n of [3, 2, 1]) {
        cd.className = 'countdown'; void cd.offsetWidth;
        cd.textContent = n; cd.className = 'countdown pop';
        beep(660);
        await sleep(1000);
        if (!stillHere()) break;
      }
      if (!stillHere()) break;
      cd.className = 'countdown word'; cd.textContent = '笑一個！';
      beep(990, 0.3);
      await sleep(500);
      cd.textContent = '';
      if (!stillHere() || !video.videoWidth) break;
      shots.push(grabShot(video, video.videoWidth, video.videoHeight, true));
      const f = $('flash'); f.className = 'flash'; void f.offsetWidth; f.className = 'flash go';
      if (i < L.shots - 1) await sleep(700);
    }
    cd.textContent = '';
    $('shootBtn').disabled = false;
    $('changeModeBtn').disabled = false;
    shooting = false;
    if (screen === 'camera' && shots.length === L.shots) showReview();
  }

  // 沒有相機時改選照片；連拍要選滿張數
  function loadImage(file) {
    return new Promise(res => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => { const c = grabShot(img, img.naturalWidth, img.naturalHeight, false); URL.revokeObjectURL(url); res(c); };
      img.onerror = () => { URL.revokeObjectURL(url); res(null); };
      img.src = url;
    });
  }
  $('fileInput').addEventListener('change', async e => {
    const files = [...(e.target.files || [])];
    e.target.value = '';
    for (const f of files) {
      if (shots.length >= L.shots) break;
      const c = await loadImage(f);
      if (c) shots.push(c);
    }
    if (screen !== 'camera') return;
    if (shots.length >= L.shots) showReview();
    else if (shots.length) $('camDesc').textContent = `已選 ${shots.length} 張，還要再選 ${L.shots - shots.length} 張。`;
  });

  $('startBtn').onclick = () => { beep(880, 0.05); show('mode'); };
  function goCamera() {
    shots = [];
    liveText();
    show('camera');
    setLive(true);
    startCamera();
  }
  $('shootBtn').onclick = shoot;
  $('retakeBtn').onclick = () => { shots = []; liveText(); setLive(true); };
  $('changeModeBtn').onclick = () => { stopCamera(); shots = []; show('mode'); };
  $('useBtn').onclick = () => {
    stopCamera();
    objects = []; selected = null; frameId = FRAMES[0].id;
    show('decorate');
    buildFrameList();
    render();
  };

  // ===== 2 裝飾 =====
  const canvas = $('editCanvas');
  const ctx = canvas.getContext('2d');
  const measure = document.createElement('canvas').getContext('2d');

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function sparkle(c, x, y, r, color) {
    c.beginPath();
    c.moveTo(x, y - r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.quadraticCurveTo(x, y, x, y + r);
    c.quadraticCurveTo(x, y, x - r, y);
    c.quadraticCurveTo(x, y, x, y - r);
    c.fillStyle = color; c.fill();
  }

  // 粉圓體只有一種粗細，描一圈同色細邊當粗體
  function boldText(c, text, x, y, color, weight) {
    c.lineJoin = 'round';
    c.lineWidth = weight;
    c.strokeStyle = color;
    c.fillStyle = color;
    c.strokeText(text, x, y);
    c.fillText(text, x, y);
  }

  function bubbleBox(o) {
    measure.font = `400 ${o.size}px ${FONT}`;
    const tw = measure.measureText(o.text).width;
    const padX = o.size * 0.6, padY = o.size * 0.42, tail = o.size * 0.45;
    const bw = tw + padX * 2, bh = o.size + padY * 2;
    return { w: bw, h: bh + tail, bh, tail };
  }
  function objBox(o) {
    if (o.type === 'sticker') return { w: o.size, h: o.size * STK[o.key].ratio };
    return bubbleBox(o);
  }

  function drawObject(c, o) {
    c.save();
    c.translate(o.x, o.y);
    c.rotate(o.rot);
    if (o.type === 'sticker') {
      const s = STK[o.key], b = objBox(o);
      if (s.img) c.drawImage(s.img, -b.w / 2, -b.h / 2, b.w, b.h);
    } else {
      const b = bubbleBox(o);
      const top = -b.h / 2, bottom = top + b.bh;
      const lw = Math.max(5, o.size * 0.09);
      c.lineJoin = 'round';
      c.lineWidth = lw;
      c.strokeStyle = '#08040c';
      c.fillStyle = '#ffffff';
      // 尾巴
      c.beginPath();
      c.moveTo(-b.w * 0.22, bottom - lw);
      c.lineTo(-b.w * 0.30, top + b.h);
      c.lineTo(-b.w * 0.04, bottom - lw);
      c.closePath();
      c.fill(); c.stroke();
      roundRect(c, -b.w / 2, top, b.w, b.bh, Math.min(b.bh / 2, o.size * 0.8));
      c.fill(); c.stroke();
      // 蓋住尾巴和泡泡相接的線
      c.beginPath();
      c.moveTo(-b.w * 0.22 + lw, bottom - lw * 0.5);
      c.lineTo(-b.w * 0.04 - lw, bottom - lw * 0.5);
      c.lineWidth = lw * 1.4; c.strokeStyle = '#ffffff'; c.stroke();
      c.font = `400 ${o.size}px ${FONT}`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      boldText(c, o.text, 0, top + b.bh / 2 + o.size * 0.04, '#08040c', o.size * 0.04);
    }
    c.restore();
  }

  // 長條照片在螢幕上很小，所以把手大小用「螢幕上的大小」換算
  function uiScale() {
    const r = canvas.getBoundingClientRect();
    return r.width ? L.W / r.width : 1;
  }
  const handleR = () => 22 * uiScale();
  function handlePos(o) {
    const b = objBox(o), cos = Math.cos(o.rot), sin = Math.sin(o.rot);
    const R = handleR(), m = 7 * uiScale();
    // 貼紙放很大時，按鈕仍留在畫面內，才按得到
    const at = (lx, ly) => ({
      x: clamp(o.x + lx * cos - ly * sin, R, L.W - R),
      y: clamp(o.y + lx * sin + ly * cos, R, L.H - R),
    });
    return { del: at(-b.w / 2 - m, -b.h / 2 - m), xf: at(b.w / 2 + m, b.h / 2 + m), b, R, m };
  }
  function drawSelection(c, o) {
    const { del, xf, b, R, m } = handlePos(o);
    const u = R / 46;
    c.save();
    c.translate(o.x, o.y); c.rotate(o.rot);
    c.setLineDash([18 * u, 12 * u]);
    c.lineWidth = 8 * u; c.strokeStyle = '#ffffff';
    c.strokeRect(-b.w / 2 - m, -b.h / 2 - m, b.w + m * 2, b.h + m * 2);
    c.lineWidth = 4 * u; c.strokeStyle = '#08040c';
    c.strokeRect(-b.w / 2 - m, -b.h / 2 - m, b.w + m * 2, b.h + m * 2);
    c.restore();
    c.setLineDash([]);
    // 刪除鈕
    c.beginPath(); c.arc(del.x, del.y, R, 0, Math.PI * 2);
    c.fillStyle = '#B42318'; c.fill(); c.lineWidth = 6 * u; c.strokeStyle = '#fff'; c.stroke();
    c.beginPath();
    c.moveTo(del.x - 16 * u, del.y - 16 * u); c.lineTo(del.x + 16 * u, del.y + 16 * u);
    c.moveTo(del.x + 16 * u, del.y - 16 * u); c.lineTo(del.x - 16 * u, del.y + 16 * u);
    c.lineWidth = 8 * u; c.lineCap = 'round'; c.stroke();
    // 縮放旋轉鈕
    c.beginPath(); c.arc(xf.x, xf.y, R, 0, Math.PI * 2);
    c.fillStyle = '#ff7d2a'; c.fill(); c.lineWidth = 6 * u; c.strokeStyle = '#fff'; c.stroke();
    c.beginPath(); c.arc(xf.x, xf.y, 20 * u, -Math.PI * 0.15, Math.PI * 1.35);
    c.lineWidth = 7 * u; c.strokeStyle = '#08040c'; c.stroke();
    const ax = xf.x + 20 * u * Math.cos(-Math.PI * 0.15), ay = xf.y + 20 * u * Math.sin(-Math.PI * 0.15);
    c.beginPath(); c.moveTo(ax - 12 * u, ay - 6 * u); c.lineTo(ax + 4 * u, ay - 2 * u); c.lineTo(ax + 2 * u, ay - 18 * u);
    c.lineJoin = 'round'; c.stroke();
  }

  function drawComposite(c, withUI) {
    const f = FRAMES.find(x => x.id === frameId) || FRAMES[0];
    c.fillStyle = f.bg;
    c.fillRect(0, 0, L.W, L.H);
    // 照片
    c.imageSmoothingQuality = 'high';
    shots.forEach((s, i) => {
      const y = L.pad + i * (L.ph + L.gap);
      c.save();
      roundRect(c, L.pad, y, L.pw, L.ph, 20);
      c.clip();
      c.drawImage(s, L.pad, y, L.pw, L.ph);
      c.restore();
    });
    // 底部文字：標題＋展覽名稱・日期
    const mid = L.W / 2, maxText = L.W - L.pad * 2;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = `400 ${L.title}px ${FONT}`;
    boldText(c, TITLE, mid, L.stripY + L.strip * 0.4, f.text, L.title * 0.03);
    const name = (config.eventName || '').trim();
    const line = name ? `${name}・${todayText()}` : todayText();
    let size = L.sub;
    c.font = `400 ${size}px ${FONT}`;
    while (c.measureText(line).width > maxText && size > 16) { size -= 2; c.font = `400 ${size}px ${FONT}`; }
    c.fillStyle = f.sub;
    c.fillText(line, mid, L.stripY + L.strip * 0.76);
    const a = L.W * 0.075, b = L.W * 0.125;
    sparkle(c, a, L.stripY + L.strip * 0.5, 30, f.deco);
    sparkle(c, b, L.stripY + L.strip * 0.28, 14, f.deco);
    sparkle(c, L.W - a, L.stripY + L.strip * 0.5, 30, f.deco);
    sparkle(c, L.W - b, L.stripY + L.strip * 0.74, 14, f.deco);
    // 貼紙與泡泡
    for (const o of objects) drawObject(c, o);
    if (withUI && selected) drawSelection(c, selected);
  }

  let rafId = 0;
  function render() {
    if (rafId) return;
    rafId = requestAnimationFrame(() => { rafId = 0; drawComposite(ctx, true); });
  }

  function buildFrameList() {
    const box = $('frameList');
    box.innerHTML = '';
    for (const f of FRAMES) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tile' + (f.id === frameId ? ' on' : '');
      b.setAttribute('aria-label', '邊框：' + f.name);
      b.innerHTML = `<i class="swatch" style="background:${f.bg}"></i><span>${f.name}</span>`;
      b.onclick = () => { frameId = f.id; buildFrameList(); render(); };
      box.appendChild(b);
    }
  }
  function buildPickers() {
    const sl = $('stickerList');
    for (const s of STICKERS) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tile';
      b.innerHTML = `<img src="${s.url}" alt=""><span>${s.name}</span>`;
      b.setAttribute('aria-label', '加入' + s.name);
      b.onclick = () => addObject({ type: 'sticker', key: s.id, size: s.w * L.kSticker });
      sl.appendChild(b);
    }
    const pl = $('phraseList');
    for (const t of PHRASES) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = t;
      b.onclick = () => addObject({ type: 'bubble', text: t, size: L.bubble });
      pl.appendChild(b);
    }
    for (const img of document.querySelectorAll('img[data-sticker]')) img.src = STK[img.dataset.sticker].url;
  }

  function addObject(o) {
    const r = (a) => (Math.random() - 0.5) * a;
    o.id = ++uid;
    o.x = L.W / 2 + r(L.pw * 0.3);
    o.y = L.stripY / 2 + r(L.stripY * 0.5);
    o.rot = r(0.3);
    objects.push(o);
    selected = o;
    $('hint').style.opacity = 1;
    render();
  }

  // --- 手指／滑鼠操作：拖曳、右下角鈕縮放旋轉、兩指縮放旋轉 ---
  function toCanvas(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * L.W / r.width, y: (e.clientY - r.top) * L.H / r.height };
  }
  function hitObject(p) {
    for (let i = objects.length - 1; i >= 0; i--) {
      const o = objects[i], b = objBox(o);
      const dx = p.x - o.x, dy = p.y - o.y;
      const lx = dx * Math.cos(-o.rot) - dy * Math.sin(-o.rot);
      const ly = dx * Math.sin(-o.rot) + dy * Math.cos(-o.rot);
      const m = 8 * uiScale();
      if (Math.abs(lx) <= b.w / 2 + m && Math.abs(ly) <= b.h / 2 + m) return o;
    }
    return null;
  }
  function sizeLimits(o) { return o.type === 'sticker' ? [70, L.W] : [32, 220]; }

  const pointers = new Map();
  let gesture = null;
  function pinchInfo() {
    const [a, b] = [...pointers.values()];
    return { d: Math.hypot(b.x - a.x, b.y - a.y) || 1, ang: Math.atan2(b.y - a.y, b.x - a.x), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  }
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const p = toCanvas(e);
    pointers.set(e.pointerId, p);
    if (pointers.size === 2 && selected) {
      const pi = pinchInfo();
      gesture = { mode: 'pinch', o: selected, ...pi, size: selected.size, rot: selected.rot, ox: selected.x, oy: selected.y };
      return;
    }
    if (pointers.size > 1) return;
    if (selected) {
      const h = handlePos(selected);
      if (Math.hypot(p.x - h.del.x, p.y - h.del.y) <= h.R * 1.3) {
        objects = objects.filter(o => o !== selected);
        selected = null; gesture = null; render();
        return;
      }
      if (Math.hypot(p.x - h.xf.x, p.y - h.xf.y) <= h.R * 1.3) {
        const o = selected;
        gesture = { mode: 'xf', o, d: Math.hypot(p.x - o.x, p.y - o.y) || 1, ang: Math.atan2(p.y - o.y, p.x - o.x), size: o.size, rot: o.rot };
        return;
      }
    }
    const o = hitObject(p);
    if (o) {
      objects = objects.filter(x => x !== o); objects.push(o);   // 點到的放最上層
      selected = o;
      gesture = { mode: 'move', o, dx: o.x - p.x, dy: o.y - p.y };
      $('hint').style.opacity = 0;
    } else {
      selected = null; gesture = null;
    }
    render();
  });
  canvas.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const p = toCanvas(e);
    pointers.set(e.pointerId, p);
    if (!gesture) return;
    const o = gesture.o, [lo, hi] = sizeLimits(o);
    if (gesture.mode === 'move') {
      o.x = clamp(p.x + gesture.dx, 0, L.W);
      o.y = clamp(p.y + gesture.dy, 0, L.H);
    } else if (gesture.mode === 'xf') {
      const d = Math.hypot(p.x - o.x, p.y - o.y);
      o.size = clamp(gesture.size * d / gesture.d, lo, hi);
      o.rot = gesture.rot + Math.atan2(p.y - o.y, p.x - o.x) - gesture.ang;
    } else if (gesture.mode === 'pinch' && pointers.size >= 2) {
      const pi = pinchInfo();
      o.size = clamp(gesture.size * pi.d / gesture.d, lo, hi);
      o.rot = gesture.rot + pi.ang - gesture.ang;
      o.x = clamp(gesture.ox + pi.mx - gesture.mx, 0, L.W);
      o.y = clamp(gesture.oy + pi.my - gesture.my, 0, L.H);
    }
    render();
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (gesture && gesture.mode === 'pinch' && pointers.size < 2) gesture = null;
    if (pointers.size === 0) gesture = null;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  $('reshootBtn').onclick = goCamera;
  $('finishBtn').onclick = finish;

  // ===== 3 帶走 =====
  function finish() {
    selected = null;
    const out = document.createElement('canvas');
    out.width = L.W; out.height = L.H;
    drawComposite(out.getContext('2d'), false);
    show('done');
    upState('loading');
    out.toBlob(blob => {
      if (!blob) { upState('fail'); return; }
      finalBlob = blob;
      if (finalUrl) URL.revokeObjectURL(finalUrl);
      finalUrl = URL.createObjectURL(blob);
      $('finalImg').src = finalUrl;
      upload();
    }, 'image/jpeg', 0.9);
  }

  function upState(s) {
    $('upLoading').hidden = s !== 'loading';
    $('upOk').hidden = s !== 'ok';
    $('upFail').hidden = s !== 'fail';
    $('done').classList.toggle('offline', s === 'fail');
  }

  function blobToBase64(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  }

  async function upload() {
    const run = ++uploadRun;
    upState('loading');
    const url = (config.uploadUrl || '').trim();
    if (!url || !finalBlob || navigator.onLine === false) { upState('fail'); return; }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 40000);
    try {
      const image = await blobToBase64(finalBlob);
      // 用 text/plain 送出，Google Apps Script 才收得到（不會被瀏覽器的跨網域檢查擋下）
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ image }),
        signal: ctrl.signal,
      });
      const data = await res.json();
      if (run !== uploadRun) return;
      if (!data.ok || !data.id) throw new Error(data.error || 'upload failed');
      const link = url + (url.includes('?') ? '&' : '?') + 'id=' + encodeURIComponent(data.id);
      drawQR(link);
      upState('ok');
    } catch (e) {
      if (run === uploadRun) upState('fail');
    } finally {
      clearTimeout(timer);
    }
  }

  function drawQR(text) {
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount(), quiet = 3, cell = 10;
    const c = $('qrCanvas');
    c.width = c.height = (n + quiet * 2) * cell;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = '#08040c';
    for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) {
      if (qr.isDark(r, k)) x.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
    }
  }

  $('retryBtn').onclick = upload;
  $('backEditBtn').onclick = () => { uploadRun++; show('decorate'); render(); };
  $('nextBtn').onclick = resetAll;

  function resetAll() {
    uploadRun++;
    stopCamera();
    hideIdle();
    shots = []; objects = []; selected = null; finalBlob = null;
    if (finalUrl) { URL.revokeObjectURL(finalUrl); finalUrl = null; }
    $('finalImg').removeAttribute('src');
    $('shotPreview').getContext('2d').clearRect(0, 0, PH_W, PH_H);
    $('countdown').textContent = '';
    show('home');
  }

  // ===== 閒置自動回首頁 =====
  let lastAct = Date.now();
  function poke() { lastAct = Date.now(); hideIdle(); }
  function hideIdle() { $('idleOverlay').hidden = true; }
  for (const ev of ['pointerdown', 'keydown']) addEventListener(ev, poke, { capture: true, passive: true });
  setInterval(() => {
    if (screen === 'home' || !$('settings').hidden || shooting) { lastAct = Math.max(lastAct, Date.now() - 1000); return; }
    const limit = screen === 'done' ? IDLE_DONE_MS : IDLE_MS;
    const left = limit + IDLE_WARN_S * 1000 - (Date.now() - lastAct);
    if (left <= 0) resetAll();
    else if (left <= IDLE_WARN_S * 1000) {
      $('idleNum').textContent = Math.ceil(left / 1000);
      $('idleOverlay').hidden = false;
    }
  }, 250);

  // ===== 現場設定：連點 5 下左上角 =====
  let taps = 0, tapTimer = 0;
  $('logo').addEventListener('click', () => {
    taps++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { taps = 0; }, 2500);
    if (taps >= 5) { taps = 0; openSettings(); }
  });
  function openSettings() {
    $('setEvent').value = config.eventName || '';
    $('setUrl').value = config.uploadUrl || '';
    setStatus('');
    $('settings').hidden = false;
  }
  function setStatus(t, cls) { const s = $('setStatus'); s.textContent = t; s.className = 'status' + (cls ? ' ' + cls : ''); }
  $('closeSetBtn').onclick = () => { $('settings').hidden = true; if (screen === 'decorate') render(); };
  $('saveSetBtn').onclick = () => {
    config.eventName = $('setEvent').value.trim();
    config.uploadUrl = $('setUrl').value.trim();
    if (saveConfig()) setStatus('已儲存，這台裝置會記住。', 'ok');
    else setStatus('這次有效，但這個瀏覽器不能記住設定（可能是無痕模式）。', 'bad');
    if (screen === 'decorate') render();
  };
  $('testBtn').onclick = async () => {
    const url = $('setUrl').value.trim();
    if (!url) { setStatus('請先填上傳網址。', 'bad'); return; }
    setStatus('測試中…');
    try {
      const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'ping=1');
      const data = await res.json();
      setStatus(data.ok ? '連線成功 ✓' : '連得到，但回應不對，請確認網址。', data.ok ? 'ok' : 'bad');
    } catch (e) {
      setStatus('連不上，請確認網址和網路。', 'bad');
    }
  };
  $('fsBtn').onclick = () => {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (req) {
      Promise.resolve(req.call(el)).catch(() => setStatus('這台裝置不支援全螢幕。', 'bad'));
    } else setStatus('這台裝置不支援全螢幕。', 'bad');
  };

  // ===== 開始 =====
  stickerReady.then(buildPickers);
  // 字型載入後再畫，照片上的字才會是粉圓體；字型是分批下載，所以要指名用到的字
  if (document.fonts && document.fonts.load) {
    const chars = TITLE + PHRASES.join('') + '0123456789.・' + (config.eventName || '');
    document.fonts.load(`400 74px "Huninn"`, chars).then(() => { if (screen === 'decorate') render(); }).catch(() => {});
  }
  show('home');
})();
</script>
</body>
</html>
